<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1,
                   maximum-scale=1,
                   user-scalable=no">

    <title>Mobile FPS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- GAME SCREEN -->
    <div id="game"></div>

    <!-- HUD -->
    <div id="hud">

        <div id="health">
            ❤️ 100
        </div>

        <div id="lives">
            Lives: 3
        </div>

        <div id="weapon">
            Pistol
        </div>

        <div id="ammo">
            12 / 12
        </div>

        <div id="crosshair">
            +
        </div>

    </div>

    <!-- MOBILE CONTROLS -->
    <div id="controls">

        <div id="joystick">
            <div id="joystick-stick"></div>
        </div>

        <div id="action-buttons">

            <button id="shootButton">
                🔫
            </button>

            <button id="jumpButton">
                ⬆️
            </button>

            <button id="crouchButton">
                🧎
            </button>

            <button id="slideButton">
                💨
            </button>

            <button id="sprintButton">
                🏃
            </button>

            <button id="reloadButton">
                🔄
            </button>

            <button id="switchWeaponButton">
                🔫🔄
            </button>

            <button id="settingsButton">
                ⚙️
            </button>

        </div>

    </div>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="menu">

        <div class="menu-box">

            <h1>🔥 MOBILE FPS</h1>

            <button id="playButton">
                PLAY
            </button>

            <button id="mapButton">
                🗺️ MAPS
            </button>

            <button id="menuSettingsButton">
                ⚙️ SETTINGS
            </button>

        </div>

    </div>

    <!-- MAP MENU -->
    <div id="mapMenu" class="menu hidden">

        <div class="menu-box">

            <h2>🗺️ SELECT MAP</h2>

            <button data-map="1">MAP 1</button>
            <button data-map="2">MAP 2</button>
            <button data-map="3">MAP 3</button>
            <button data-map="4">MAP 4</button>
            <button data-map="5">MAP 5</button>
            <button data-map="6">MAP 6</button>
            <button data-map="7">MAP 7</button>
            <button data-map="8">MAP 8</button>
            <button data-map="9">MAP 9</button>

            <button id="mapBackButton">
                BACK
            </button>

        </div>

    </div>

    <!-- SETTINGS -->
    <div id="settingsMenu" class="menu hidden">

        <div class="menu-box">

            <h2>⚙️ SETTINGS</h2>

            <label>
                Sensitivity
                <input
                    id="sensitivity"
                    type="range"
                    min="0.1"
                    max="3"
                    step="0.1"
                    value="1">
            </label>

            <label>
                Volume
                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.1"
                    value="1">
            </label>

            <button id="graphicsButton">
                Graphics: HIGH
            </button>

            <button id="settingsBackButton">
                BACK
            </button>

        </div>

    </div>

    <!-- GAME OVER -->
    <div id="gameOverMenu" class="menu hidden">

        <div class="menu-box">

            <h1>💀 GAME OVER</h1>

            <p>All 3 lives were used.</p>

            <button id="restartButton">
                🔄 PLAY AGAIN
            </button>

            <button id="gameOverMenuButton">
                MENU
            </button>

        </div>

    </div>

    <!-- THREE.JS -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- GAME FILES -->
    <script src="weapons.js"></script>
    <script src="enemies.js"></script>
    <script src="maps.js"></script>
    <script src="controls.js"></script>
    <script src="settings.js"></script>
    <script src="game.js"></script>

</body>
                                        </html>
